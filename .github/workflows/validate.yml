name: Validate Templates

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v5
        with:
          node-version: 20

      - name: Install dependencies (retry)
        uses: ./.github/actions/npm-ci-retry

      - name: Validate all templates
        run: node bin/open-agreements.js validate

      - name: Check committed template snapshot
        run: npm run check:templates-snapshot

      - name: Check no CC BY-ND derivatives
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: node scripts/check_external_source_integrity.mjs
