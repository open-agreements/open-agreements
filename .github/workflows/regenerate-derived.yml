---
name: Regenerate Derived Artifacts

# The oa-ssot-sync bot pushes source updates (templates, corpus) without running
# this repo's generators, so every bot PR used to land red on the derived-artifact
# gates — and one was merged red, taking main down with it. This job regenerates
# the projections and pushes them onto the bot's own PR branch, so the drift is
# fixed before review instead of after merge.
#
# Human PRs are deliberately not auto-committed to: they get the plain
# `npm run check:derived` failure in CI, which names the one command to run.

"on":
  pull_request_target:
    types: [opened, synchronize, reopened]
    branches: [main]

permissions:
  contents: read

concurrency:
  group: regenerate-derived-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  regenerate:
    # Only for the trusted sync bot, and only for branches that live in this
    # repo. pull_request_target runs with repo credentials, so never let it
    # check out or execute code from a fork.
    if: >-
      github.event.pull_request.user.login == 'oa-ssot-sync[bot]' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      # A token from the app, not GITHUB_TOKEN: pushes made with GITHUB_TOKEN do
      # not re-trigger CI, which would leave the PR showing the stale red run.
      - name: Generate GitHub App token
        id: app-token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.RELEASE_BOT_APP_ID }}
          private-key: ${{ secrets.RELEASE_BOT_PRIVATE_KEY }}

      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          token: ${{ steps.app-token.outputs.token }}

      - uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies (retry)
        uses: ./.github/actions/npm-ci-retry

      - name: Regenerate derived artifacts
        run: npm run generate:derived

      - name: Commit and push if anything drifted
        env:
          BRANCH: ${{ github.event.pull_request.head.ref }}
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo "Derived artifacts already current — nothing to push."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add --all
          git commit -m "chore(generated): regenerate derived artifacts"
          git push origin "HEAD:${BRANCH}"
          echo "Pushed regenerated artifacts to ${BRANCH}."
