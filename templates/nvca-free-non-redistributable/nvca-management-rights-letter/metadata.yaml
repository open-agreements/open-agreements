name: Model Management Rights Letter
category: venture-financing
description: Management rights letter granting ERISA-qualifying management rights to venture capital fund investors.
source_url: https://nvca.org/wp-content/uploads/2025/12/NVCA-2020-Management-Rights-Letter-1-1.docx
source_version: '2020'
license_note: >-
  NVCA model documents are freely downloadable but not redistributable. This field-selector contains only transformation
  instructions, not the source document.
source_sha256: 9661d2a68ca20ee77cf553f1ec5804f08147e7e4c35f5a03938e76a778083e8b
optional: false
distribution: linked
artifact_type: field-selector
fields:
  - name: company_name
    type: string
    description: Full legal name of the Company in normal title case for the operative body text
  - name: company_name_upper
    type: string
    description: >-
      Company name in uppercase for the left "Very truly yours" signature column. The pinned source's bracket labels are
      reversed relative to the operative roles, so the recipe binds by column function rather than the literal bracket word.
  - name: letter_date
    type: date
    description: >-
      Date of the letter (fills the "______, 20__" dateline). Accepts ISO YYYY-MM-DD (rendered as e.g.
      "July 15, 2026") or a display-ready date string, which replaces the entire dateline including the
      pre-printed "20" — do not supply a partial date expecting the "20__" year stub to remain.
  - name: purchased_shares
    type: string
    description: Number of shares of preferred stock purchased by the investor (e.g. 1,000,000)
  - name: investor_name
    type: string
    description: Full name of the investor
  - name: investor_name_upper
    type: string
    description: Investor name in uppercase for the right "Agreed and Accepted" signature column
  - name: investor_notice_city
    type: string
    description: City in the Investor's notice address printed in the letter header
  - name: investor_notice_state
    type: string
    description: State in the Investor's notice address printed in the letter header
  - name: investor_notice_street_address
    type: string
    description: Street address for the Investor printed in the letter header
  - name: investor_notice_zip_code
    type: string
    description: ZIP code in the Investor's notice address printed in the letter header
  - name: company_letterhead
    type: string
    description: Company name or other company-identifying text for the Company letterhead block
    default: ''
  - name: company_address
    type: string
    description: Full Company address printed in the Company letterhead block; do not use the Investor notice address here
    default: ''
  - name: signature_page_marker
    type: string
    description: Signature page marker text
    default: Signature Page Follows
  - name: series_designation
    type: string
    description: Series designation for preferred stock (e.g., A, B, C), matching the charter and stock purchase agreement
    default: ""
  - name: include_management_consultation_rights
    type: boolean
    description: Include consultation and management-advice rights while the Investor lacks Board representation
    default: true
  - name: include_inspection_rights
    type: boolean
    description: Include the books, records, facilities, and information inspection right
    default: true
  - name: include_board_materials_rights
    type: boolean
    description: Include concurrent Board-material delivery and the right to address the Board while the Investor lacks Board representation
    default: true
  - name: include_foreign_person_restrictions
    type: boolean
    description: Include the Defense Production Act and CFIUS foreign-person restrictions paragraph
    default: false
  - name: include_independent_business_reasons_merger_condition
    type: boolean
    description: Require the merger to satisfy the independent-business-reasons and reorganization conditions in clause (x)
    default: false
  - name: include_successor_or_liquid_consideration_merger_condition
    type: boolean
    description: Require the successor to provide reasonably comparable rights or pay solely cash or national-exchange-listed securities
    default: true
  - name: investor_signatory_name
    type: string
    description: Printed name of the Investor signatory; the handwritten By line remains blank
  - name: investor_signatory_title
    type: string
    description: Title of the Investor signatory
  - name: company_signatory_name
    type: string
    description: Printed name of the Company signatory; the handwritten By line remains blank
  - name: company_signatory_title
    type: string
    description: Title of the Company signatory
priority_fields:
  - company_name
  - company_name_upper
  - letter_date
  - purchased_shares
  - investor_name
  - investor_name_upper
  - investor_notice_city
  - investor_notice_state
  - investor_notice_street_address
  - investor_notice_zip_code
  - company_address
  - series_designation
  - investor_signatory_name
  - investor_signatory_title
  - company_signatory_name
  - company_signatory_title
artifact_kind: letter
capabilities:
  - review
party_roles: []
signature_roles: []
mutation_policy: immutable
maturity: experimental
