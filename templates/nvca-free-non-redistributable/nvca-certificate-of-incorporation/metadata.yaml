name: Model Certificate of Incorporation
category: venture-financing
description: >-
  Amended and restated certificate of incorporation for venture-backed Delaware corporations, defining preferred stock
  rights, preferences, and privileges.
source_url: https://nvca.org/wp-content/uploads/2025/10/NVCA-Model-COI-10-1-2025.docx
source_version: 10-1-2025
license_note: >-
  NVCA model documents are freely downloadable but not redistributable. This field-selector contains only transformation
  instructions, not the source document.
source_sha256: d75600769c12724990de48149d7a2bb161f3522daa54b1783672f93697d87d29
optional: false
distribution: linked
artifact_type: field-selector
market_data_citations:
  - id: wsgr-2025
    label: WSGR Entrepreneurs Report 2023-2025
  - id: cooley-q4-2025
    label: Cooley Venture Financing Report Q4 2025
  - id: fenwick-2024
    label: Fenwick Silicon Valley Venture Capital Survey 2024
fields:
  - name: company_name
    type: string
    description: Full legal name of the corporation
  - name: registered_agent_address
    type: string
    description: Street address of the registered agent in Delaware
  - name: registered_agent_city
    type: string
    description: City of the registered agent office
  - name: registered_agent_county
    type: string
    description: County of the registered agent office
  - name: registered_agent_name
    type: string
    description: Name of the registered agent in Delaware
  - name: total_authorized_shares
    type: string
    description: Total number of authorized shares of all classes
  - name: number_of_classes
    type: string
    description: Number of classes of stock (e.g., two)
    default: two
  - name: common_shares_authorized
    type: string
    description: Number of authorized shares of Common Stock
  - name: preferred_shares_authorized
    type: string
    description: Number of authorized shares of Preferred Stock
  - name: series_designation
    type: string
    description: Series designation for preferred stock (e.g., A, B, C)
    default: ""
  - name: original_issue_price
    type: string
    description: Original purchase price per share of Series A Preferred Stock
  - name: initial_purchase_price
    type: string
    description: Initial Series A purchase price per share
  - name: liquidation_preference_multiple
    type: string
    description: Liquidation preference multiple (e.g., 1, 1.5, 2)
    default: '1'
  - name: dividend_rate_percent
    type: string
    description: Annual dividend rate percentage on Preferred Stock
    default: '8'
  - name: dividend_rate_per_share
    type: string
    description: Dividend rate per annum per share of Preferred Stock (dollar amount)
  - name: preferred_shares_outstanding_threshold
    type: string
    description: Minimum shares of Preferred Stock outstanding for protective provisions to apply
  - name: preferred_director_seats
    type: string
    description: Number of Preferred Director board seats
  - name: preferred_director_election_clause
    type: string
    description: Computed whole grammatical carrier for the Preferred Director board-seat count
  - name: common_director_seats
    type: string
    description: Number of directors elected exclusively by the Common Stock
  - name: at_large_director_seats
    type: string
    description: Number of directors elected by Common and Preferred Stock voting together
  - name: escrow_consideration_treatment
    type: enum
    description: Treatment of escrow or holdback amounts in a Deemed Liquidation Event
    options: [initial_consideration, additional_consideration]
    default: initial_consideration
  - name: preferred_shares_designated_portion
    type: string
    description: Number of authorized Preferred Stock shares designated as the named series
    default: all
  - name: preferred_vote_threshold
    type: enum
    description: Approval threshold used where the form offers all holders or a majority of holders/directors
    options: [all, majority]
    default: majority
  - name: original_incorporation_name
    type: string
    description: Original incorporation name, if different from current company name (leave blank if same)
  - name: original_incorporation_date
    type: date
    description: >-
      Historical date the corporation was originally incorporated (the recital date), which need not equal the effective
      date of this amended and restated charter. Accepts ISO YYYY-MM-DD (rendered as e.g. "July 15, 2026") or a
      display-ready date string.
  - name: redemption_start_date
    type: date
    description: >-
      Earliest date on which preferred stock may be redeemed ("on or after <date>"). Accepts ISO YYYY-MM-DD (rendered as e.g.
      "March 15, 2026") or a display-ready date string.
  - name: no_redemption_clause
    type: string
    description: Computed whole carrier for the no-redemption statement when Article Sixth is not elected
  - name: qualified_financing_notice_days
    type: string
    description: Days of prior notice required for qualified financing
  - name: qualified_ipo_minimum_price
    type: string
    description: Minimum public offering price per share for a Qualified IPO, excluding the dollar sign
  - name: qualified_ipo_gross_proceeds
    type: string
    description: Minimum offering proceeds required for a Qualified IPO, excluding the dollar sign
  - name: qualified_ipo_proceeds_basis
    type: enum
    description: Whether the Qualified IPO proceeds threshold is measured on a gross or net basis
    options: [gross, net]
    default: gross
  - name: qualified_direct_listing_market_cap
    type: string
    description: Minimum expected market capitalization for a Qualified Direct Listing, excluding the dollar sign
  - name: qualified_ipo_price_clause
    type: string
    description: Computed whole grammatical carrier for the Qualified IPO minimum price
  - name: qualified_ipo_proceeds_clause
    type: string
    description: Computed whole grammatical carrier for the Qualified IPO proceeds threshold and gross/net election
  - name: qualified_direct_listing_market_cap_clause
    type: string
    description: Computed whole grammatical carrier for the Qualified Direct Listing market-capitalization threshold
  - name: no_cumulative_voting
    type: boolean
    description: Include 'no cumulative voting' clause
  - name: common_stock_voting_limitation
    type: boolean
    description: Include clause limiting common stock from vetoing preferred-only amendments
  - name: authorized_shares_vote_provision
    type: boolean
    description: Include simplified vote provision for changing authorized Common Stock count
  - name: include_officer_indemnification
    type: boolean
    description: Include officer indemnification alongside director indemnification
  - name: include_redemption_cross_ref
    type: boolean
    description: Include cross-reference to Section 6.1 (Redemption)
  - name: signature_page_marker
    type: string
    description: Signature page marker text
    default: Signature Page Follows
  - name: time_zone
    type: string
    description: Time zone for notices and deadlines (e.g., Eastern, Pacific)
    default: Eastern
  - name: par_value
    type: string
    description: Par value per share of common and preferred stock
    default: '0.0001'
  - name: specify_percentage
    type: string
    description: Percentage threshold for specified provisions; enter the number only (for example, 60), without the percent sign
  - name: specify_percentage_clause
    type: string
    description: Complete percentage carrier set by computed.json from the number-only percentage input
  - name: effective_date
    type: date
    description: >-
      Date this amended and restated certificate is EXECUTED, printed on the signature block ("executed by a duly
      authorized officer of this corporation on <date>") — supply the execution/signature date, not a later intended
      filing date. Under 8 Del. C. Section 103 the charter becomes legally effective on filing with the Delaware
      Secretary of State (or a specified delayed effective time), which may differ from this execution date. Accepts ISO
      YYYY-MM-DD (rendered as e.g. "July 15, 2026") or a display-ready date string.
  - name: adjustment_notice_days
    type: string
    description: Days to provide notice of conversion price adjustments
    default: '10'
  - name: redemption_interest_rate
    type: string
    description: Annual interest rate on unredeemed shares (percentage)
  - name: redemption_compounding_frequency
    type: enum
    description: Frequency at which interest on unredeemed shares is compounded
    options: [annually, quarterly, monthly]
  - name: conversion_notice_days
    type: string
    description: Days prior to record date for mandatory conversion notice
    default: '10'
  - name: dividend_formula_prefix
    type: string
    description: Non-cumulative dividend formula prefix phrase
    default: the greater of
  - name: dividend_formula_alt
    type: string
    description: Alternative dividend formula phrase
    default: the sum of
  - name: acquisition_exception_shares
    type: string
    description: Max shares issuable as acquisition consideration without triggering anti-dilution
  - name: strategic_partnership_exception_shares
    type: string
    description: Max shares issuable for strategic partnerships without triggering anti-dilution
  - name: dividend_type
    type: string
    description: 'Dividend structure: non_cumulative_as_converted (>95%), non_cumulative_fixed, or cumulative'
    default: non_cumulative_as_converted
  - name: liquidation_participation
    type: string
    description: 'Liquidation participation type: non_participating (94-96%) or participating'
    default: non_participating
  - name: anti_dilution_type
    type: enum
    description: 'Anti-dilution formula: broad_based_weighted_average (>98%) or full_ratchet'
    options: [broad_based_weighted_average, full_ratchet]
    default: broad_based_weighted_average
  - name: include_pay_to_play
    type: boolean
    description: Include Section 5A pay-to-play conversion provisions (<5% of deals)
  - name: include_redemption
    type: boolean
    description: Include Article Sixth full redemption provisions (2-5% of deals)
  - name: include_direct_listing
    type: boolean
    description: Include a Qualified Direct Listing as a mandatory-conversion trigger
  - name: include_dle_financing_exclusion
    type: boolean
    description: Exclude a bona fide preferred-stock financing from the Deemed Liquidation Event definition
  - name: include_dle_redemption_mechanics
    type: boolean
    description: Include the Section 2.3.2(b) post-Deemed-Liquidation-Event redemption mechanics
  - name: include_nonstandard_protective_provisions
    type: boolean
    description: Include the optional Requisite Directors operational-veto provisions
  - name: include_lender_exemption
    type: boolean
    description: Include the lender and equipment-lessor Exempted Securities paragraph
  - name: include_supplier_exemption
    type: boolean
    description: Include the supplier and service-provider Exempted Securities paragraph
  - name: include_acquisition_exemption
    type: boolean
    description: Include the acquisition-consideration Exempted Securities paragraph
  - name: include_strategic_partnership_exemption
    type: boolean
    description: Include the strategic-partnership Exempted Securities paragraph
  - name: include_exclusive_forum
    type: boolean
    description: Include the Delaware exclusive-forum provision
  - name: include_california_repurchases
    type: boolean
    description: Include the California Corporations Code Section 500 repurchase provision
  - name: include_officer_exculpation
    type: boolean
    description: Extend the Article Ninth exculpation provision to officers
priority_fields:
  - company_name
  - original_issue_price
  - initial_purchase_price
  - qualified_ipo_minimum_price
  - qualified_ipo_gross_proceeds
  - qualified_direct_listing_market_cap
  - par_value
  - specify_percentage
  - effective_date
  - total_authorized_shares
  - common_shares_authorized
  - preferred_shares_authorized
artifact_kind: agreement
capabilities:
  - review
party_roles: []
signature_roles: []
mutation_policy: immutable
maturity: experimental
