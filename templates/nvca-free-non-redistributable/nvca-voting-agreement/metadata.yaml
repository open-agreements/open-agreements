name: Model Voting Agreement
category: venture-financing
description: >-
  Standard-form voting agreement for venture capital financings, covering board composition, drag-along rights, and
  stockholder voting obligations.
source_url: https://nvca.org/wp-content/uploads/2024/10/NVCA-Model-VA-10-1-2025.docx
source_version: 10-1-2025
license_note: >-
  NVCA model documents are freely downloadable but not redistributable. This field-selector contains only transformation
  instructions, not the source document.
source_sha256: 3496d7ae9343d1b5b7db13239313c6512e7e0d68d13273538c4dbf06416a5f0d
optional: false
distribution: linked
artifact_type: field-selector
fields:
  - name: company_name
    type: string
    description: Full legal name of the company
  - name: investor_name
    type: string
    description: Full name of the lead investor
  - name: key_holder_name
    type: string
    description: Name of the key holder (typically founder/CEO)
  - name: preferred_director_eligibility_basis
    type: enum
    options: [minimum_shares, minimum_percentage]
    description: Select whether the preferred-director designation right continues based on a minimum share count or a minimum as-converted ownership percentage
    default: minimum_shares
  - name: preferred_director_minimum_shares
    type: string
    description: Minimum Preferred Stock shares required when preferred_director_eligibility_basis is minimum_shares (number only); otherwise leave empty
    default: ''
  - name: preferred_director_minimum_percentage
    type: string
    description: Minimum as-converted ownership percentage required when preferred_director_eligibility_basis is minimum_percentage (number only, for example, 5); otherwise leave empty
    default: ''
  - name: preferred_director_minimum_shares_display
    type: string
    description: Computed active share-count threshold or a visible insertion marker; do not supply directly
    default: ''
  - name: preferred_director_minimum_percentage_display
    type: string
    description: Computed active number-only percentage threshold or a visible insertion marker; do not supply directly
    default: ''
  - name: requisite_holders_standard
    type: enum
    options: [percentage, majority]
    description: Select whether Requisite Holders is an exact percentage threshold or a simple majority
    default: percentage
  - name: requisite_holders_percentage
    type: string
    description: Bare percentage number used when requisite_holders_standard is percentage (for example, 60; do not include the percent sign)
    default: ''
  - name: requisite_holders_text
    type: string
    description: Computed selected Requisite Holders threshold text; do not supply directly
    default: ''
  - name: board_size
    type: string
    description: Authorized number of Board seats under the agreed post-closing board structure (number only)
  - name: vacant_board_seats_at_closing
    type: string
    description: Number of authorized Board seats intentionally vacant at the Closing (number only)
    default: '0'
  - name: common_director_designation
    type: enum
    options: [qualified_key_holders, named_service_contingent]
    description: Select whether the Common Director is designated by the Qualified Key Holders or is a named director whose service is employment-contingent
    default: qualified_key_holders
  - name: preferred_director_name
    type: string
    description: Initial preferred director named in the selected board-composition provision
  - name: common_director_name
    type: string
    description: Initial common director, used in both the Qualified Key Holder designation and named-director alternatives
  - name: ceo_director_name
    type: string
    description: Chief Executive Officer serving as the initial CEO Director
  - name: mutual_director_name
    type: string
    description: Initial independent mutual director designated by the other seated directors
  - name: include_qualified_direct_listing_termination
    type: boolean
    description: Whether a Qualified Direct Listing terminates the agreement alongside an underwritten public offering
    default: true
  - name: sale_section_3_survives
    type: boolean
    description: Whether Section 3 survives a Sale of the Company to the extent needed to enforce that sale
    default: true
  - name: termination_date_mode
    type: enum
    options: [no_fixed_date, fixed_date]
    description: Select whether the agreement has an additional fixed calendar termination date
    default: no_fixed_date
  - name: fixed_termination_date
    type: date
    description: Additional calendar termination date; required only when termination_date_mode is fixed_date
    default: ''
  - name: effective_date
    type: date
    description: >-
      Effective date of the agreement ("is made as of <date>"). Accepts ISO YYYY-MM-DD (rendered as e.g.
      "March 15, 2026") or a display-ready date string.
  - name: has_prior_agreement
    type: boolean
    description: Whether this agreement amends and restates an expressly identified predecessor Voting Agreement
    default: false
  - name: prior_agreement_date
    type: date
    description: Date of the predecessor Voting Agreement; used only when has_prior_agreement is true
    default: ''
  - name: company_counsel
    type: string
    description: Company counsel name and address
  - name: counsel_cc
    type: string
    description: Additional counsel to CC on notices, or empty string if none
    default: ''
  - name: judicial_district
    type: string
    description: Federal judicial district for disputes (e.g. District of Delaware)
    default: District of Delaware
  - name: state_of_incorporation
    type: string
    description: State of incorporation (proper noun, e.g. Delaware); also names the state courts in the dispute-resolution clause
    default: Delaware
  - name: specify_percentage
    type: string
    description: Percentage threshold for drag-along and amendment provisions — include the percent sign (e.g. 60%); occurrences where the source carries a trailing % absorb it
  - name: amended_restated_upper
    type: string
    description: AMENDED AND RESTATED or empty string
    default: ''
  - name: amended_restated
    type: string
    description: Amended and Restated or empty string
    default: ''
  - name: signature_page_marker
    type: string
    description: Signature page marker text
    default: Signature Page Follows
  - name: series_designation
    type: string
    description: Series designation for preferred stock (e.g., A, B, C), matching the charter and stock purchase agreement
    default: ""
  - name: par_value
    type: string
    description: Par value per share of common and preferred stock (number only, e.g. 0.0001 — the document supplies the dollar sign)
    default: '0.0001'
  - name: qualified_key_holder_service_basis
    type: enum
    description: Service qualification used in the Qualified Key Holder definition
    options: [employee_only, employee_or_consultant]
  - name: drag_approval_mode
    type: enum
    description: Approvals required in addition to the Selling Investors for a drag-along
    options: [selling_investors_only, plus_key_holders, plus_board, plus_key_holders_and_board]
  - name: include_drag_along
    type: boolean
    description: Include the model drag-along right and related Sale mechanics
  - name: drag_selling_investor_basis
    type: enum
    description: Securities used for the Selling Investor approval numerator
    options: [preferred_stock, converted_common]
  - name: drag_requires_key_holder_approval
    type: boolean
    description: Computed selector input for the separate Qualified Key Holder vote
    default: false
  - name: drag_requires_board_approval
    type: boolean
    description: Computed selector input for Board approval
    default: false
  - name: drag_include_certificate_amendment
    type: boolean
    description: Include related Restated Certificate amendments or restatements in the compelled vote
  - name: drag_include_definitive_agreements
    type: boolean
    description: Include related definitive transaction agreements in the compelled vote
  - name: drag_delay_uses_reasonable_expectation
    type: boolean
    description: Qualify competing proposals by whether they reasonably could be expected to delay or impair the Sale
  - name: drag_include_gross_negligence_exception
    type: boolean
    description: Include gross negligence in the Stockholder Representative liability exception
  - name: drag_include_company_representation_escrow
    type: boolean
    description: Permit Company-representation claims to be paid from the common escrow
  - name: drag_include_same_form_consideration
    type: boolean
    description: Include Section 3.2(g)'s same-form-of-consideration protection
  - name: stock_sale_notice_days
    type: string
    description: Advance notice period for a different allocation in a Stock Sale, number only
  - name: director_removal_triggers
    type: multiselect
    description: Events that permit or require removal of a designated director
    options: [designator_request, voting_stockholder_request, mutual_director_vote, loss_of_eligibility, sanctions]
  - name: director_removal_other_than_for_cause
    type: boolean
    description: Permit removal other than for cause when the selected contractual triggers apply
  - name: proxyholder_officers
    type: enum
    description: Company officers appointed as Proxyholders
    options: [president_and_board_chair]
  - name: proxy_includes_sale_actions
    type: boolean
    description: Extend proxy and power-of-attorney authority to Section 3 Sale actions
  - name: joinder_security_scope
    type: enum
    description: Securities whose later issuance triggers a Voting Agreement joinder
    options: [shares_only, shares_options_and_warrants]
  - name: joinder_minimum_ownership_percentage
    type: string
    description: Minimum post-issuance ownership triggering joinder, number only
  - name: key_holder_status_approval
    type: enum
    description: Authority approving Key Holder status for later Stockholders
    options: [company_sole_discretion]
  - name: key_holder_consent_percentage
    type: string
    description: Qualified Key Holder amendment-consent threshold, number only
  - name: key_holder_ownership_floor_percentage
    type: string
    description: Outstanding-capital ownership floor below which Key Holder consent is not required, number only
  - name: common_director_amendment_approval
    type: enum
    description: Consent required to amend the Common Director provision
    options: [qualified_key_holders, majority_common]
  - name: sanctions_scope
    type: enum
    description: Sanctions authorities and lists included in the Voting Agreement
    options: [united_states_only, united_states_eu_uk]
  - name: sanctions_authorities_suffix
    type: string
    description: Computed additional sanctions authorities; do not supply directly
    default: ''
  - name: sanctions_lists_suffix
    type: string
    description: Computed additional sanctions lists; do not supply directly
    default: ''
  - name: dispute_resolution_mode
    type: enum
    description: Dispute-resolution alternative
    options: [arbitration, courts]
  - name: enforcement_costs_mode
    type: enum
    description: Allocation of enforcement costs
    options: [own_costs, prevailing_party]
  - name: company_signatory_name
    type: string
    description: Printed name of the Company's authorized signatory
  - name: company_signatory_title
    type: string
    description: Title of the Company's authorized signatory
  - name: company_notice_address
    type: string
    description: Company's notice address on its signature page
  - name: company_notice_email
    type: string
    description: Company's notice email on its signature page
  - name: investor_signatory_name
    type: string
    description: Printed name of the lead Investor's authorized signatory
  - name: investor_signatory_title
    type: string
    description: Title of the lead Investor's authorized signatory
  - name: investors
    type: array
    description: Investor notice and signature schedule rows
    items:
      - name: name
        type: string
        description: Investor legal name
      - name: address
        type: string
        description: Investor notice address
      - name: phone
        type: string
        description: Investor notice phone number
      - name: email
        type: string
        description: Investor notice email address
      - name: counsel_cc
        type: string
        description: Investor counsel copied on notices, or empty string if none
  - name: key_holders
    type: array
    description: Key Holder personal notice and signature schedule rows
    items:
      - name: name
        type: string
        description: Key Holder legal name
      - name: address
        type: string
        description: Key Holder personal notice address
      - name: email
        type: string
        description: Key Holder personal email address
priority_fields:
  - company_name
  - investor_name
  - key_holder_name
  - preferred_director_eligibility_basis
  - requisite_holders_standard
  - requisite_holders_percentage
  - board_size
  - vacant_board_seats_at_closing
  - common_director_designation
  - preferred_director_name
  - common_director_name
  - ceo_director_name
  - mutual_director_name
  - include_qualified_direct_listing_termination
  - sale_section_3_survives
  - termination_date_mode
  - effective_date
  - company_counsel
  - judicial_district
  - state_of_incorporation
  - specify_percentage
  - series_designation
  - par_value
  - qualified_key_holder_service_basis
  - drag_approval_mode
  - include_drag_along
  - drag_selling_investor_basis
  - drag_include_certificate_amendment
  - drag_include_definitive_agreements
  - drag_delay_uses_reasonable_expectation
  - drag_include_gross_negligence_exception
  - drag_include_company_representation_escrow
  - drag_include_same_form_consideration
  - stock_sale_notice_days
  - director_removal_triggers
  - director_removal_other_than_for_cause
  - proxyholder_officers
  - proxy_includes_sale_actions
  - joinder_security_scope
  - joinder_minimum_ownership_percentage
  - key_holder_status_approval
  - key_holder_consent_percentage
  - key_holder_ownership_floor_percentage
  - common_director_amendment_approval
  - sanctions_scope
  - dispute_resolution_mode
  - enforcement_costs_mode
  - company_signatory_name
  - company_signatory_title
  - company_notice_address
  - company_notice_email
  - investor_signatory_name
  - investor_signatory_title
  - investors
  - key_holders
artifact_kind: agreement
capabilities:
  - review
party_roles: []
signature_roles: []
mutation_policy: immutable
maturity: experimental
