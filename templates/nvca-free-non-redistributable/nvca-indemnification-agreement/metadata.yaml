name: Model Indemnification Agreement
category: venture-financing
description: >-
  Director and officer indemnification agreement for venture-backed companies, providing indemnification and advancement
  of expenses.
source_url: https://nvca.org/wp-content/uploads/2021/12/NVCA-2020-Indemnification-Agreement.docx
source_version: '2020'
license_note: >-
  NVCA model documents are freely downloadable but not redistributable. This field-selector contains only transformation
  instructions, not the source document.
source_sha256: f9b61b4d99e245573de41d9469925b4332f871ec0e6ac6593055cdfe17825300
optional: false
distribution: linked
artifact_type: field-selector
fields:
  - name: indemnitee_name
    type: string
    description: Full legal name of the indemnitee (director or officer)
  - name: indemnitee_address
    type: string
    description: Address of the indemnitee
  - name: company_name
    type: string
    description: Name of the corporation providing indemnification
  - name: agreement_effective_date
    type: date
    description: Effective date in the opening clause (ISO YYYY-MM-DD, e.g. 2026-03-20, rendered as March 20, 2026)
  - name: fund_sponsor_name
    type: string
    description: Name of the sponsoring fund or entity appointing the indemnitee
  - name: appointing_stockholder_name
    type: string
    description: Full legal name of the venture fund or entity defined as the Appointing Stockholder in Section 1(d)
  - name: indemnitee_role_scope
    type: enum
    options: [directors, officers, directors_or_officers]
    description: >-
      Corporate roles covered by the agreement. The directors_or_officers option renders the source recital as
      "directors or officers" and the operative undertaking as "an officer or director."
    default: directors_or_officers
  - name: indemnitee_role_scope_plural
    type: string
    description: Computed plural role phrase derived from indemnitee_role_scope; do not supply directly
  - name: indemnitee_role_scope_singular
    type: string
    description: Computed singular role phrase derived from indemnitee_role_scope; do not supply directly
  - name: indemnitee_pronoun_possessive
    type: string
    description: Possessive pronoun for the indemnitee entity (e.g. its)
    default: its
  - name: indemnitee_pronoun_subject
    type: string
    description: Subject pronoun for the indemnitee (for this fixture, they)
    default: they
  - name: indemnitee_pronoun_object
    type: string
    description: Object pronoun for the indemnitee (for this fixture, them)
    default: them
  - name: company_signatory_name
    type: string
    description: Printed name of the Company's authorized signatory
  - name: company_signatory_title
    type: string
    description: Title of the Company's authorized signatory
  - name: company_notice_address
    type: string
    description: Company's notice address
  - name: company_notice_attention
    type: string
    description: Person and title receiving Company notices
  - name: process_agent_name
    type: string
    description: Delaware process agent named for the Indemnitee
  - name: process_agent_address
    type: string
    description: Delaware address of the process agent
  - name: bylaws_name
    type: string
    description: Name of the company's bylaws document
    default: Bylaws
  - name: certificate_name
    type: string
    description: Name of the company's certificate of incorporation
    default: Certificate of Incorporation
  - name: include_appointing_stockholder_ipo_termination
    type: boolean
    description: >-
      Whether the Appointing Stockholder's Section 1(d) rights terminate at the closing of the Company's initial public
      offering, subject to the source form's protection for proceedings based on pre-termination facts
  - name: appointing_stockholder_ipo_termination_carrier
    type: string
    description: Complete punctuation-bearing Section 1(d) carrier set by computed.json from the IPO-termination election
  - name: signature_page_marker
    type: string
    description: Signature page marker text
    default: Signature Page Follows
priority_fields:
  - indemnitee_name
  - indemnitee_address
  - company_name
  - agreement_effective_date
  - appointing_stockholder_name
  - include_appointing_stockholder_ipo_termination
  - indemnitee_role_scope
  - indemnitee_pronoun_possessive
  - indemnitee_pronoun_subject
  - indemnitee_pronoun_object
  - company_signatory_name
  - company_signatory_title
  - company_notice_address
  - company_notice_attention
  - process_agent_name
  - process_agent_address
  - bylaws_name
  - certificate_name
artifact_kind: agreement
capabilities:
  - review
party_roles: []
signature_roles: []
mutation_policy: immutable
maturity: experimental
