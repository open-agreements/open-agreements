name: Model Indemnification Agreement
category: venture-financing
description: >-
  Director and officer indemnification agreement for venture-backed companies, providing indemnification and advancement
  of expenses.
source_url: https://nvca.org/wp-content/uploads/2021/12/NVCA-2020-Indemnification-Agreement.docx
source_version: '2020'
license_note: >-
  NVCA model documents are freely downloadable but not redistributable. This field-selector contains only transformation
  instructions, not the source document.
source_sha256: f9b61b4d99e245573de41d9469925b4332f871ec0e6ac6593055cdfe17825300
optional: false
distribution: linked
artifact_type: field-selector
fields:
  - name: indemnitee_name
    type: string
    description: Full legal name of the indemnitee (director or officer)
  - name: indemnitee_address
    type: string
    description: >-
      Address of the Delaware service-of-process agent named in the optional jurisdiction clause. Retained under its
      original field name for compatibility; this is not an indemnitee mailing-address slot in the NVCA source.
  - name: service_of_process_agent_name
    type: string
    description: Name of the Delaware service-of-process agent in the optional jurisdiction clause
  - name: company_name
    type: string
    description: Name of the corporation providing indemnification
  - name: agreement_effective_date
    type: date
    description: Effective date in the opening clause (ISO YYYY-MM-DD, e.g. 2026-03-20, rendered as March 20, 2026)
  - name: fund_sponsor_name
    type: string
    description: Name of the sponsoring fund or entity appointing the indemnitee
  - name: indemnitee_role_scope
    type: enum
    options: [directors, officers, directors_or_officers]
    description: >-
      Corporate roles covered by the agreement: directors, officers, or directors and officers. The
      directors_or_officers option renders the NVCA recital as "directors or officers" and the later singular carrier
      as "an officer or director."
    default: directors_or_officers
  - name: indemnitee_pronoun_possessive
    type: string
    description: Possessive pronoun for the indemnitee entity (e.g. its)
    default: its
  - name: bylaws_name
    type: string
    description: Name of the company's bylaws document
    default: Bylaws
  - name: certificate_name
    type: string
    description: Name of the company's certificate of incorporation
    default: Certificate of Incorporation
  - name: and_appointing_stockholder
    type: string
    description: Optional additional party text or empty string
    default: ''
  - name: appointing_stockholder_ipo_termination_clause
    type: string
    description: >-
      Optional clause text that terminates Appointing Stockholder rights at IPO closing, inserted before the
      sentence-ending period after "representative on the Company's Board" in Section 1(d). Supply the clause with a
      leading comma and no trailing period (e.g. ", and terminate on the closing of an initial public offering of the
      Company's Common Stock; provided, however, ..."); leave empty to omit.
    default: ''
  - name: signature_page_marker
    type: string
    description: Signature page marker text
    default: Signature Page Follows
priority_fields:
  - indemnitee_name
  - indemnitee_address
  - service_of_process_agent_name
  - company_name
  - agreement_effective_date
  - indemnitee_role_scope
  - indemnitee_pronoun_possessive
  - bylaws_name
  - certificate_name
artifact_kind: agreement
capabilities:
  - review
party_roles: []
signature_roles: []
mutation_policy: immutable
maturity: experimental
