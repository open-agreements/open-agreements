name: Model Right of First Refusal and Co-Sale Agreement
category: venture-financing
description: >-
  Right of first refusal and co-sale agreement for venture financings, restricting transfer of founder shares and
  providing investor co-sale rights.
source_url: https://nvca.org/wp-content/uploads/2025/10/NVCA-Model-ROFRA-10-1-2025.docx
source_version: 10-1-2025
license_note: >-
  NVCA model documents are freely downloadable but not redistributable. This field-selector contains only transformation
  instructions, not the source document.
source_sha256: 126b4a402d41b768ff0c9aebf593792159c31ca7a930c440dd5ae0516ef4c4ad
optional: false
distribution: linked
artifact_type: field-selector
fields:
  - name: company_name
    type: string
    description: Full legal name of the company (e.g. Acme Corp, Inc.)
  - name: investor_name
    type: string
    description: Full legal name of the lead investor
  - name: key_holder_name
    type: string
    description: Full name of the key holder (founder or executive)
  - name: company_counsel
    type: string
    description: Name and address of company's legal counsel
  - name: counsel_cc
    type: string
    description: Additional counsel to CC on notices, or empty string if none
    default: ''
  - name: amended_restated_upper
    type: string
    description: Uppercase prefix if amending a prior agreement (e.g. AMENDED AND RESTATED) or empty string
    default: ''
  - name: amended_restated
    type: string
    description: Title-case prefix if amending a prior agreement (e.g. Amended and Restated) or empty string
    default: ''
  - name: judicial_district
    type: string
    description: Federal judicial district for dispute resolution (e.g. District of Delaware)
    default: District of Delaware
  - name: state_of_incorporation
    type: string
    description: State of incorporation (proper noun, e.g. Delaware); also names the state courts in the dispute-resolution clause
    default: Delaware
  - name: business_description
    type: string
    description: Brief description of the company's business
  - name: signature_page_marker
    type: string
    description: Signature page marker text
    default: Signature Page Follows
  - name: effective_date
    type: date
    description: >-
      Effective date of the agreement ("is made as of <date>"). Accepts ISO YYYY-MM-DD (rendered as e.g.
      "March 15, 2026") or a display-ready date string.
  - name: specify_percentage
    type: string
    description: Specified percentage threshold for key holder transfers — include the percent sign (e.g. 60%); occurrences where the source carries a trailing % absorb it
  - name: rofr_response_days
    type: string
    description: Number of days for the company and investors to respond to a ROFR notice (default 45)
    default: '45'
  - name: key_holders_label
    type: string
    description: Label for the key holders group (e.g. Key Holders or Founders)
    default: Key Holders
  - name: series_designation
    type: string
    description: Series designation for preferred stock (e.g., A, B, C), matching the charter and stock purchase agreement
    default: ""
  - name: par_value
    type: string
    description: Par value per share of common and preferred stock (number only, e.g. 0.0001 — the document supplies the dollar sign)
    default: '0.0001'
  - name: competitor_exclusion_mode
    type: enum
    description: Whether to identify a person whose group is expressly excluded from the Competitor definition
    default: none
    options:
      - none
      - named
  - name: excluded_competitor_name
    type: string
    description: Name expressly excluded from the Competitor definition when competitor_exclusion_mode is named
    default: ''
  - name: investor_minimum_shares
    type: string
    description: >-
      Minimum shares an Investor and its affiliates must collectively hold to retain Investor status under the agreement
  - name: permitted_transfer_percentage
    type: string
    description: >-
      Percentage of Transfer Stock that a Key Holder may sell under the optional permitted-transfer exception, as a number only
  - name: key_holder_consent_threshold_percentage
    type: string
    description: >-
      Capital Stock ownership percentage below which Key Holder consent is not required, as a number only
  - name: permitted_transferee_minimum_shares
    type: string
    description: >-
      Minimum shares an assignee or transferee must hold after transfer to receive assignment rights, including digit grouping
  - name: investor_minimum_shares_display
    type: string
    description: Computed Investor minimum-share threshold or a visible insertion marker; do not supply directly
    default: ''
  - name: permitted_transfer_percentage_display
    type: string
    description: Computed permitted-transfer percentage or a visible insertion marker; do not supply directly
    default: ''
  - name: key_holder_consent_threshold_percentage_display
    type: string
    description: Computed Key Holder consent threshold percentage or a visible insertion marker; do not supply directly
    default: ''
  - name: permitted_transferee_minimum_shares_display
    type: string
    description: Computed permitted-transferee minimum-share threshold or a visible insertion marker; do not supply directly
    default: ''
priority_fields:
  - company_name
  - investor_name
  - key_holder_name
  - company_counsel
  - judicial_district
  - state_of_incorporation
  - business_description
  - effective_date
  - specify_percentage
  - rofr_response_days
  - series_designation
  - par_value
  - competitor_exclusion_mode
artifact_kind: agreement
capabilities:
  - review
party_roles: []
signature_roles: []
mutation_policy: immutable
maturity: experimental
