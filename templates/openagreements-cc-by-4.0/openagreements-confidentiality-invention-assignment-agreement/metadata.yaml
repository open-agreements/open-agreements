name: Confidentiality & Invention Assignment Agreement (CIIAA)
category: invention-assignment
description: Employee proprietary information and inventions assignment agreement with explicit prior-inventions and personal-project carveout language placeholders.
source_url: https://github.com/open-agreements/open-agreements/tree/main/templates/openagreements-confidentiality-invention-assignment-agreement
version: 0.5.0
stability: experimental
license: CC-BY-4.0
allow_derivatives: true
distribution: bundled
artifact_type: template
attribution_text: Authored by OpenAgreements contributors. Baseline structure inspired by permissive public references including the Balanced Employee IP Agreement (CC0) and Papertrail legal-docs (CC0). Licensed under CC BY 4.0.
fields:
  - name: company_name
    type: string
    description: Legal name of employer
    section: Parties
  - name: company_signatory_name
    type: string
    description: Full name of the authorized signatory signing for the company
    section: Parties
  - name: company_signatory_title
    type: string
    description: Title of the authorized signatory signing for the company
    section: Parties
  - name: employee_name
    type: string
    description: Full legal name of employee
    section: Parties
  - name: effective_date
    type: date
    description: Effective date of this agreement
    section: Timing
  - name: prior_inventions_disclosure
    type: string
    description: List of prior inventions excluded from assignment, or None
    section: Inventions
  - name: excluded_inventions_statement
    type: string
    description: Carveout statement for independently developed inventions
    default: Inventions Employee develops entirely on personal time without using company equipment, supplies, facilities, or trade secret information are excluded, except for inventions that either (a) relate to company business or its actual or demonstrably anticipated research or development, or (b) result from work performed for the company.
    section: Inventions
  - name: return_of_materials_timing
    type: string
    description: Timing for return or deletion of company materials
    section: Confidentiality
  - name: confidentiality_other_duration
    type: string
    description: Duration of confidentiality obligations for Confidential Information other than trade secrets after employment ends
    display_label: Other Confidential Information Duration
    default: For as long as the information remains confidential, and, where applicable law requires a fixed period, two years after employment ends
    default_value_rationale: In an evidence-verified sample of 1,116 employee agreements filed on EDGAR, 71.9% stated an indefinite duty for ordinary confidential information and 15.7% tied the duty to the information remaining confidential. Among the 51 instruments that used or incorporated a fixed period, two years was the most frequent resolved term. The fallback applies only where governing law requires a fixed period; Wisconsin can void an unbounded non-trade-secret covenant, so the fallback is not optional there.
    rationale_source: prevalence
    prevalence_key: edgar-ciiaa/confidentiality-duration
    section: Confidentiality
  - name: post_termination_assistance
    type: string
    description: Cooperation obligations after termination
    default: reasonable assistance with filings and signatures related to assigned inventions
    section: Inventions
  - name: governing_law
    type: string
    description: Governing law state
    section: Legal
  - name: venue
    type: string
    description: Venue for disputes
    default: state and federal courts in the governing law state
    section: Legal
  - name: personnel_nonsolicit_included
    type: boolean
    description: Whether the post-employment personnel non-solicitation covenant is included. Set false when the engagement prohibits post-employment restraints, or when the governing law voids a personnel non-solicit; the covenant is then omitted entirely instead of rendered with a savings clause. California employee nonsolicits carry substantial enforceability risk; “to the extent permitted” does not guarantee validity. Cooley retains a qualified covenant, while Orrick instructs users to remove its post-term language for California. Omitting it does not affect the invention-assignment, confidentiality, during-employment duty-of-loyalty, or statutory carve-out clauses. Not shown as a cover-term row.
    display_label: Personnel Non-Solicitation Included
    default: true
    default_value_rationale: 'True preserves the form''s existing output: the covenant renders unless a caller affirmatively opts out, so a fill that omits this field renders the same document it rendered before the field existed.'
    section: Post-Employment Restraints
  - name: future_employer_notice_included
    type: boolean
    description: 'Whether the notice-to-future-employers clause is included. Set false together with personnel_nonsolicit_included when the engagement prohibits post-employment restraints: the clause obliges Employee to disclose these obligations to a future employer, so leaving it in reintroduces a post-employment obligation the covenant opt-out was meant to remove. Omitting it does not affect the confidentiality obligations themselves. Not shown as a cover-term row.'
    display_label: Future-Employer Notice Included
    default: true
    default_value_rationale: 'True preserves the form''s existing output: the clause renders unless a caller affirmatively opts out, so a fill that omits this field renders the same document it rendered before the field existed.'
    section: Post-Employment Restraints
priority_fields: []
artifact_kind: agreement
capabilities:
  - create
  - review
  - render
party_roles:
  - company
  - employee
signature_roles:
  - company
  - employee
mutation_policy: fields_only
maturity: experimental
