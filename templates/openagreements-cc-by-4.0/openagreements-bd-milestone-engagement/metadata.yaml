name: Business Development Milestone Engagement
category: services
description: >-
  A contractor-first business development engagement that turns relationship
  claims into dated, measurable deliverables: warm introductions, held
  meetings, and a first closed opportunity. It includes optional draw,
  milestone-bonus, revenue-percentage, exclusivity, draw-recovery, and short
  customer/vendor non-solicitation terms. Drafting notes: a LinkedIn connection
  alone is not a warm introduction; specify counts and dates rather than relying
  on handshake promises; and do not treat a draw without milestones as a
  substitute for a properly classified payroll relationship. Independent-
  contractor status depends on the facts and applicable law, not this label.
  Draw recovery, offsets, deductions, commissions, and restrictive covenants
  vary materially by state; obtain state-specific counsel before use. General
  information only, not legal advice.
source_url: https://github.com/open-agreements/open-agreements/tree/main/templates/openagreements-cc-by-4.0/openagreements-bd-milestone-engagement
version: 0.1.0
stability: experimental
license: CC-BY-4.0
allow_derivatives: true
distribution: bundled
artifact_type: template
attribution_text: Authored by OpenAgreements contributors. Licensed under CC BY 4.0.
