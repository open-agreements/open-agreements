name: Hedge Fund Private Placement Memorandum
category: fund-formation
description: Private placement memorandum skeleton for a hedge fund, meaning an open-end private investment fund organized as a Delaware limited partnership and relying on Section 3(c)(1) of the Investment Company Act, offering its interests under Rule 506 of Regulation D.
source_url: https://github.com/open-agreements/open-agreements/tree/main/templates/openagreements-hedge-fund-private-placement-memorandum
version: 0.1.0
stability: experimental
license: CC-BY-4.0
allow_derivatives: true
distribution: bundled
artifact_type: template
attribution_text: Authored by OpenAgreements contributors using selected provisions from identified public private investment fund offering memoranda. The cited sources are not a representative market sample. Licensed under CC BY 4.0.
fields:
  - name: fund_name
    type: string
    description: Legal name of the Delaware limited partnership
    section: Fund
  - name: general_partner_name
    type: string
    description: Legal name of the general partner
    section: Fund
  - name: manager_name
    type: string
    description: Legal name of the investment manager
    section: Fund
  - name: offering_date
    type: date
    description: Date of the private placement memorandum
    section: Offering
  - name: fund_address
    type: string
    description: Principal business address of the fund
    default: '[Fund address]'
    section: Directory
  - name: general_partner_address
    type: string
    description: Principal business address of the general partner
    default: '[General partner address]'
    section: Directory
  - name: manager_address
    type: string
    description: Principal business address of the investment manager
    default: '[Investment manager address]'
    section: Directory
  - name: adviser_registration_status
    type: enum
    description: Registration or exempt-reporting status of the investment manager
    options:
      - sec_registered
      - sec_registration_required
      - state_registered
      - exempt_reporting_adviser
      - other_unregistered
    section: Directory
  - name: administrator_name
    type: string
    description: Legal name of the fund administrator
    default: '[Administrator name]'
    section: Directory
  - name: administrator_address
    type: string
    description: Business address of the fund administrator
    default: '[Administrator address]'
    section: Directory
  - name: auditor_name
    type: string
    description: Legal name of the independent auditor
    default: '[Auditor name]'
    section: Directory
  - name: auditor_address
    type: string
    description: Business address of the independent auditor
    default: '[Auditor address]'
    section: Directory
  - name: prime_broker_name
    type: string
    description: Legal name of the prime broker or custodian
    default: '[Prime broker or custodian name]'
    section: Directory
  - name: prime_broker_address
    type: string
    description: Business address of the prime broker or custodian
    default: '[Prime broker or custodian address]'
    section: Directory
  - name: legal_counsel_name
    type: string
    description: Legal name of fund legal counsel
    default: '[Legal counsel name]'
    section: Directory
  - name: legal_counsel_address
    type: string
    description: Business address of fund legal counsel
    default: '[Legal counsel address]'
    section: Directory
  - name: management_fee_rate
    type: string
    description: Annual management fee rate expressed as a percentage
    default: 2.0%
    default_value_rationale: The Apex memorandum states 2.0% and Smithson states 1.0%/0.9%. The two-document comparison is not a market sample.
    rationale_source: benchmark
    benchmark_ref: private-placement-memorandum/management-fee-rate
    section: Economics
  - name: management_fee_frequency
    type: enum
    description: Frequency at which the management fee is charged in advance
    options:
      - monthly
      - quarterly
      - semi-annually
      - annually
    default: quarterly
    default_value_rationale: Quarterly charging is a drafting placeholder; both memoranda in the cited comparison charge monthly.
    rationale_source: editorial
    section: Economics
  - name: performance_allocation_percent
    type: string
    description: Percentage of eligible net profits reallocated to the general partner
    default: 20%
    default_value_rationale: A 20% reallocation is a drafting placeholder; the cited comparison records 25% in one memorandum and no performance allocation in the other.
    rationale_source: editorial
    section: Economics
  - name: lock_up_months
    type: number
    description: Separate initial, nonrenewing lock-up period in months for each capital contribution
    default: 12
    default_value_rationale: A twelve-month initial lock for each contribution is a selected liquidity term that can be changed for the fund.
    section: Liquidity
  - name: withdrawal_frequency
    type: enum
    description: Frequency of permitted withdrawals after the applicable lock-up
    options:
      - monthly
      - quarterly
      - semi-annually
      - annually
    default: quarterly
    default_value_rationale: Apex permits quarterly withdrawals and Smithson permits monthly withdrawals. The two-document comparison is not a market sample.
    rationale_source: benchmark
    benchmark_ref: private-placement-memorandum/withdrawal-frequency
    section: Liquidity
  - name: withdrawal_notice_days
    type: number
    description: Calendar days of advance written notice required for a withdrawal
    default: 60
    default_value_rationale: Both memoranda in the cited comparison state sixty days. The comparison is not a market sample.
    rationale_source: benchmark
    benchmark_ref: private-placement-memorandum/withdrawal-notice-period
    section: Liquidity
  - name: minimum_initial_investment
    type: string
    description: Minimum initial subscription stated as a formatted dollar amount
    default: $1,000,000
    default_value_rationale: One million dollars is a drafting placeholder; both memoranda in the cited comparison state $250,000. It remains subject to waiver.
    rationale_source: editorial
    section: Subscriptions
  - name: gate_percent
    type: string
    description: Maximum percentage of fund net asset value payable on one withdrawal date
    default: 25%
    default_value_rationale: A 25% fund-level gate matches the corresponding partnership-agreement baseline.
    section: Liquidity
  - name: investment_objective
    type: string
    description: Concise statement of the fund investment objective, in one or two sentences of free text
    help: 'Example: The Fund seeks long-term capital appreciation by investing primarily in publicly traded U.S. equity securities.'
    default: '[The Fund seeks long-term capital appreciation by investing primarily in publicly traded U.S. equity securities.]'
    section: Investment Program
  - name: investment_strategy
    type: string
    description: Operational description of the strategy, markets, instruments, and process, as one or more paragraphs of free text
    help: 'Example: The Manager takes long and short positions in U.S.-listed companies with market capitalizations above $1 billion, selected through fundamental research. Positions are typically held for six to eighteen months.'
    default: '[The Manager takes long and short positions in U.S.-listed companies with market capitalizations above $1 billion, selected through fundamental research. Positions are typically held for six to eighteen months.]'
    section: Investment Program
  - name: leverage_policy
    type: string
    description: Free-text description of permitted borrowing and leveraged exposure, including any limit and how it is measured
    help: 'Example: The Fund may borrow from its prime broker and may use short sales and exchange-traded options. Gross exposure will not exceed 200% of the Fund''s net asset value, measured when each position is added.'
    default: '[The Fund may borrow from its prime broker and may use short sales and exchange-traded options. Gross exposure will not exceed 200% of the Fund''s net asset value, measured when each position is added.]'
    section: Investment Program
  - name: concentration_policy
    type: string
    description: Free-text description of diversification or concentration limits
    help: 'Example: No single issuer will represent more than 15% of the Fund''s net asset value, measured when the position is added.'
    default: '[No single issuer will represent more than 15% of the Fund''s net asset value, measured when the position is added.]'
    section: Investment Program
  - name: manager_principals_description
    type: string
    description: Free-text paragraph identifying each individual principal of the Manager by first and last name, with title and relevant investment experience; not an entity name
    help: 'Example: Jane Doe is the Manager''s founder and chief investment officer. She previously spent ten years as a portfolio manager at a registered investment adviser.'
    default: '[Jane Doe is the Manager''s founder and chief investment officer. She previously spent ten years as a portfolio manager at a registered investment adviser.]'
    section: Management
  - name: strategy_specific_risks_description
    type: string
    description: Free-text narrative of the risks arising from the selected strategy and instruments, as one or more paragraphs
    help: 'Example: Short Selling. A short sale can lose more than the amount invested, because the price of a borrowed security has no upper limit.'
    default: '[Short Selling. A short sale can lose more than the amount invested, because the price of a borrowed security has no upper limit.]'
    section: Risk Factors
  - name: placement_agent_compensation
    type: string
    description: Placement-agent recipient, compensation, payer, any fee offset or cap, and the payer of any excess above that offset or cap
    default: '[None, or identify recipient, compensation, payer, offsets or caps, and who pays any excess]'
    section: Expenses
priority_fields:
  - fund_name
  - general_partner_name
  - manager_name
  - management_fee_rate
  - performance_allocation_percent
  - lock_up_months
  - withdrawal_frequency
  - withdrawal_notice_days
  - minimum_initial_investment
  - gate_percent
  - investment_objective
  - investment_strategy
artifact_kind: other
capabilities:
  - create
  - review
  - render
party_roles:
  - fund
  - prospective-investor
signature_roles: []
mutation_policy: terms
maturity: experimental
