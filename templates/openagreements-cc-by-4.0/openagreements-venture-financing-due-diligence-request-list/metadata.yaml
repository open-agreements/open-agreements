name: Venture Financing Due Diligence Request List
category: venture-financing
description: A starting request list for a priced preferred stock financing, structured on the common venture diligence categories.
source_url: https://github.com/open-agreements/open-agreements/tree/main/templates/openagreements-venture-financing-due-diligence-request-list
version: '1.0'
stability: experimental
license: CC-BY-4.0
allow_derivatives: true
distribution: bundled
artifact_type: template
attribution_text: Authored by OpenAgreements contributors. Adapted from the Cooley GO sample venture capital due diligence request list, with supporting requests from the National Venture Capital Association model stock purchase agreement, K&L Gates and Carta forms. Licensed under CC BY 4.0.
omitted_clauses: drop
fields:
  - name: requesting_firm_name
    type: string
    description: Name of the law firm sending the requests for the investors
    section: Cover Sheet
  - name: company_name
    type: string
    description: Legal name of the company issuing the securities
    section: Cover Sheet
  - name: request_date
    type: date
    description: Date the request list is delivered to the Company
    section: Cover Sheet
  - name: response_due_date
    type: date
    description: Date the first response is due
    section: Cover Sheet
  - name: company_contact_name
    type: string
    description: Name of the Company contact for diligence responses
    section: Cover Sheet
priority_fields:
  - company_name
  - requesting_firm_name
  - response_due_date
artifact_kind: checklist
capabilities:
  - create
  - review
  - render
party_roles: []
signature_roles: []
mutation_policy: fields_only
maturity: experimental
